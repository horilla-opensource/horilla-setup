# Publish to PyPI when a version tag is pushed.
#
# This exists because the repository and PyPI drifted apart: 1.0.2, 1.0.3 and
# 1.0.4 were published in early 2026 while setup.py in git still said 1.0.1, so
# for seven months the released code came from someone's working copy rather
# than from a commit. Nothing was lost that time -- the published sdist was
# otherwise identical -- but nobody could tell what was in a release by reading
# the repository, which is the whole point of having one.
#
# So the tag is the trigger and the tag is checked against setup.py. A mismatch
# fails the job before anything is built, which makes the two structurally
# unable to disagree again.
name: release

on:
  push:
    tags: ["v*"]
  # Lets the whole thing be rehearsed without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches setup.py
        id: version
        run: |
          declared=$(python -c "
          import re, pathlib
          print(re.search(r'version=\"([^\"]+)\"', pathlib.Path('setup.py').read_text()).group(1))
          ")
          echo "value=$declared" >> "$GITHUB_OUTPUT"
          echo "setup.py declares $declared"

          if [ "${{ github.event_name }}" = "push" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            echo "tag is v$tagged"
            if [ "$tagged" != "$declared" ]; then
              echo "::error::tag v$tagged does not match setup.py $declared."
              echo "::error::Bump setup.py and re-tag; the two must never disagree."
              exit 1
            fi
          fi

      - name: Refuse to republish an existing version
        # PyPI rejects a duplicate upload anyway, but it does so after the build,
        # with a 400 that reads like an auth problem. Failing here says what is
        # actually wrong.
        run: |
          version="${{ steps.version.outputs.value }}"
          if curl -sf "https://pypi.org/pypi/horillasetup/$version/json" >/dev/null 2>&1; then
            echo "::error::horillasetup $version is already on PyPI. Versions are immutable -- bump and re-tag."
            exit 1
          fi
          echo "$version is not yet published"

      - name: Build
        run: |
          python -m pip install -q --upgrade pip build twine
          python -m build

      - name: Check the artifacts
        run: |
          python -m twine check dist/*
          # The migration package is the reason this release exists, and it ships
          # only because each directory has an __init__.py for find_packages().
          # A missing one produces a wheel that installs and then fails at import,
          # so it is checked here rather than discovered by a customer.
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "horillasetup/ctl.py",
              "horillasetup/migrate_v1.py",
              "horillasetup/migration_settings.py",
              "horillasetup/migration/adopt.py",
              "horillasetup/migration/fingerprint.py",
              "horillasetup/migrations/horilla_auth/0001_initial.py",
          ]
          missing = [p for p in required if p not in names]
          if missing:
              sys.exit("wheel is missing:\n  " + "\n  ".join(missing))
          print(f"{wheel}: all {len(required)} required modules present")
          PY

      - name: Install the wheel and run the CLI
        # A wheel that builds but cannot run is the failure this catches: the
        # console script is generated by setuptools, so a broken entry point
        # only shows up after installation.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install -q dist/*.whl
          /tmp/verify/bin/horillasetup --help
          /tmp/verify/bin/horillasetup migrate hrms-v2 --help | grep -q -- --from-v1
          /tmp/verify/bin/python -c "
          import horillasetup.migrate_v1, horillasetup.migration.adopt, horillasetup.migration.fingerprint
          print('installed package imports cleanly')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only a real tag publishes. workflow_dispatch builds and verifies, so the
    # whole path can be rehearsed without touching PyPI.
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/horillasetup
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's identity directly, so
      # there is no long-lived token in repository secrets to leak or rotate.
      # Configure it at https://pypi.org/manage/project/horillasetup/settings/publishing/
      # with owner horilla, repo horilla-setup, workflow release.yml, environment pypi.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Falls back to an API token if Trusted Publishing is not set up yet.
          # Leave PYPI_API_TOKEN unset once it is, and delete the token on PyPI.
          password: ${{ secrets.PYPI_API_TOKEN }}
